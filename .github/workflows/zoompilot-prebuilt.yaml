name: zoompilot prebuilt

# Cuts a release: builds develop on the self-hosted comma device and publishes the
# compiled tree to main, which is the branch users install. main is owned by this
# workflow and force-pushed on every release, so never commit to it by hand and never
# merge into it; develop is the source of truth.
#
# Run it manually from develop (Actions > Run workflow) when you want to cut a release.
#
# The runner only picks jobs up while the device is off the car: hardwared sets
# GithubRunnerSufficientVoltage above 9V and process_config stops the runner service
# when it is set. Bench-power the device to let a build run.
#
# Safety: BUILD_DIR (/data/openpilot) is only safe inside the runner's private mount
# namespace, where /data/github/openpilot is bind-mounted over it. The setup step
# aborts unless that bind is active, so a broken mount can never wipe the live install.

env:
  BUILD_DIR: "/data/openpilot"
  OUTPUT_DIR: ${{ github.workspace }}/output
  CI_DIR: ${{ github.workspace }}/release/ci
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  SOURCE_BRANCH: ${{ github.ref_name }}
  TARGET_BRANCH: main
  PUBLIC_REPO_URL: "https://github.com/chinna244/zoompilot"

on:
  workflow_dispatch:

jobs:
  guard:
    # Cheap gate so a wrong branch never occupies the device or force-pushes the
    # release branch with a build of itself.
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse to cut a release from the release branch
        run: |
          if [ "${{ env.SOURCE_BRANCH }}" = "${{ env.TARGET_BRANCH }}" ]; then
            echo "::error::${{ env.TARGET_BRANCH }} is the published release branch and is force-pushed by this workflow. Run it from develop."
            exit 1
          fi
          echo "cutting ${{ env.TARGET_BRANCH }} from ${{ env.SOURCE_BRANCH }}"

  build:
    needs: [ guard ]
    runs-on: [ self-hosted, tici ]
    concurrency:
      group: zoompilot-prebuilt-${{ github.ref_name }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.set-env.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.SOURCE_BRANCH }}
      - run: git lfs pull

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}

      - name: Set environment variables
        id: set-env
        run: |
          echo "version=$(date '+%Y.%m.%d')-${{ github.run_number }}" >> $GITHUB_OUTPUT
          source /etc/profile
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv
          export UV_PYTHON_PREFERENCE=managed
          export UV_PYTHON_INSTALL_DIR=${HOME}/uv/python
          export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT
          uv sync
          printenv >> $GITHUB_ENV

      - name: Setup build environment
        run: |
          chmod +x ${{ env.CI_DIR }}/assert_ci_openpilot_mount.sh
          # Abort before any delete if /data/openpilot is the real install.
          ${{ env.CI_DIR }}/assert_ci_openpilot_mount.sh "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/"
          sudo find $BUILD_DIR/ -mindepth 1 -delete
          # recreate marker wiped by find -delete; still must be the CI inode
          touch "${BUILD_DIR}/.ci_build_dir"
          ${{ env.CI_DIR }}/assert_ci_openpilot_mount.sh "${BUILD_DIR}"
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable

      - name: Build
        run: |
          export PYTHONPATH="$BUILD_DIR"
          ./tools/release/release_files.py | sort | uniq | rsync -rRl${RUNNER_DEBUG:+v} --files-from=- . $BUILD_DIR/
          cd $BUILD_DIR
          ln -sfn msgq_repo/msgq msgq
          ln -sfn opendbc_repo/opendbc opendbc
          ln -sfn rednose_repo/rednose rednose
          ln -sfn teleoprtc_repo/teleoprtc teleoprtc
          ln -sfn tinygrad_repo/tinygrad tinygrad
          sed -i '/from .board.jungle import PandaJungle, PandaJungleDFU/s/^/#/' panda/__init__.py
          # sunnypilot/modeld_v2 lost its SConscript upstream (chestnut refactor moved SP model
          # compilation out of scons), so it is no longer a warm-up target here
          scons -j2 cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal openpilot/sunnypilot/selfdrive/locationd
          scons -j1 cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal openpilot/selfdrive/locationd
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal
          touch ${BUILD_DIR}/prebuilt
          # Full staging coverage against BUILD_DIR (before output excludes).
          python3 ${{ env.CI_DIR }}/assert_prebuilt_integrity.py ${BUILD_DIR} \
            --workspace ${{ github.workspace }} \
            --skip-mandatory \
            --skip-metadata

      - name: Prepare output
        run: |
          sudo rm -rf ${OUTPUT_DIR}
          mkdir -p ${OUTPUT_DIR}
          rsync -am${RUNNER_DEBUG:+v} \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='__pycache__' \
            --exclude='Jenkinsfile' \
            --exclude='**/release/' \
            --exclude='**/.github/' \
            --exclude='**/openpilot/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude='${{ env.SCONS_CACHE_DIR }}' \
            --exclude='**/.git/' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='openpilot/selfdrive/modeld/models/*.onnx*' \
            --exclude='openpilot/sunnypilot/modeld*/models/*.onnx*' \
            --exclude='openpilot/third_party/*x86*' \
            --exclude='openpilot/third_party/*Darwin*' \
            --exclude='.ci_build_dir' \
            --delete-excluded \
            --chown=comma:comma \
            ${BUILD_DIR}/ ${OUTPUT_DIR}/

          # Package must be installable without the publish-time git rewrite.
          VERSION="${{ steps.set-env.outputs.version }}"
          python3 ${{ env.CI_DIR }}/write_build_metadata.py \
            ${OUTPUT_DIR} \
            --channel ${{ env.TARGET_BRANCH }} \
            --version "$VERSION" \
            --git-commit ${{ github.sha }} \
            --git-origin ${{ env.PUBLIC_REPO_URL }} \
            --git-commit-date "$(date -u '+%Y-%m-%dT%H:%M:%S+00:00')" \
            --build-style prebuilt

          # Ensure tagged version.h matches release version string.
          echo "#define SUNNYPILOT_VERSION \"$VERSION\"" > ${OUTPUT_DIR}/openpilot/sunnypilot/common/version.h

      - name: Guard artifact contents
        run: |
          # The artifact uses build.json for release metadata. publish.sh creates
          # the Git repository later, after the artifact is downloaded.
          GIT_DIRS="$(find "${OUTPUT_DIR}" -type d -name .git -print)"
          if [ -n "${GIT_DIRS}" ]; then
            echo "::error::OUTPUT_DIR contains forbidden .git directories:"
            printf '%s\n' "${GIT_DIRS}"
            exit 1
          fi
          du -sh "${OUTPUT_DIR}"

      - name: Integrity gate
        run: |
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          export PYTHONPATH="${OUTPUT_DIR}"
          export OUTPUT_DIR="${OUTPUT_DIR}"
          python3 ${{ env.CI_DIR }}/assert_prebuilt_integrity.py ${OUTPUT_DIR} --skip-release-files
          python3 - <<'PY'
          import os
          os.chdir(os.environ["OUTPUT_DIR"])
          from openpilot.common.version import get_build_metadata, get_version
          print(get_version())
          print(get_build_metadata())
          PY

      - name: Tar.gz files
        run: |
          tar czf prebuilt.tar.gz -C "${OUTPUT_DIR}" .
          GIT_DIRS="$(find "${OUTPUT_DIR}" -type d -name .git -print)"
          if [ -n "${GIT_DIRS}" ]; then
            echo "::error::OUTPUT_DIR contains forbidden .git directories after tar creation:"
            printf '%s\n' "${GIT_DIRS}"
            exit 1
          fi
          if tar tzf prebuilt.tar.gz | grep -E '(^|/)\.git(/|$)'; then
            echo "::error::prebuilt.tar.gz contains a forbidden .git directory"
            exit 1
          fi
          ls -lh prebuilt.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz

      - name: Re-enable powersave
        if: always()
        run: |
          source ${UV_PROJECT_ENVIRONMENT}/bin/activate
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --enable

  publish:
    needs: [ build ]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: zoompilot-publish-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prebuilt

      - name: Untar prebuilt
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          tar xzf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }}

      - name: Configure git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish to ${{ env.TARGET_BRANCH }}
        run: |
          ${{ env.CI_DIR }}/publish.sh \
            "${{ github.workspace }}" \
            "${{ env.OUTPUT_DIR }}" \
            "${{ env.TARGET_BRANCH }}" \
            "${{ needs.build.outputs.version }}" \
            "https://x-access-token:${{ github.token }}@github.com/chinna244/zoompilot.git" \
            "prebuilt"

      - name: Verify published tree
        run: |
          # File-level gate on the tree we just pushed (skip import: ubuntu runner may lack zmq).
          python3 - <<'PY'
          import json, pathlib, stat, sys
          root = pathlib.Path("${{ env.OUTPUT_DIR }}")
          required = [
            ".git",
            "build.json",
            "openpilot/sunnypilot/common/version.h",
            "launch_openpilot.sh",
            "openpilot/system/manager/manager.py",
            "prebuilt",
          ]
          missing = [r for r in required if not (root / r).exists()]
          if missing:
            print("missing:", missing)
            sys.exit(1)
          launch = root / "launch_openpilot.sh"
          if not (launch.stat().st_mode & (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)):
            print("launch_openpilot.sh not executable")
            sys.exit(1)
          meta = json.loads((root / "build.json").read_text())
          assert meta.get("channel") == "main", meta
          assert meta.get("openpilot", {}).get("build_style") == "prebuilt", meta
          ver = (root / "openpilot/sunnypilot/common/version.h").read_text()
          assert meta["openpilot"]["version"] in ver, (meta["openpilot"]["version"], ver)
          print("published tree mandatory files OK")
          print("version", meta["openpilot"]["version"])
          print("commit", meta["openpilot"]["git_commit"])
          PY
